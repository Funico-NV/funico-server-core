name: Swift Tests
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test default products
        run: swift test -j 4
      - name: Validate the service definition example
        run: swift run -j 4 funico-service-validate Packaging/Examples/funico-service.json
      - name: Test the traits used by the Manager and agent
        run: swift test --traits Vapor,Crypto,MCP -j 4
  mcp-prototype:
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    defaults:
      run:
        working-directory: Dev/MCPTooling
    steps:
      - uses: actions/checkout@v4
      - name: Test the pinned official SDK integration
        run: swift test --disable-automatic-resolution -j 2
      - name: Run the isolated discovery and call demo
        run: swift run --skip-build funico-mcp-demo
      - name: Check the compiled example and DocC catalog
        run: bash Scripts/check-documentation.sh
